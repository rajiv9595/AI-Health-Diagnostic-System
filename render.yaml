services:
  - type: web
    name: ai-health-backend
    env: python
    buildCommand: pip install -r backend/requirements_prod.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
    # Free tier note: Uploaded images will be lost on restart (ephemeral filesystem).
    # Models are loaded from the repo (git), so no disk needed for them.
